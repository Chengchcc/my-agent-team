name: Publish

# Tag-driven release: push a tag like v0.2.0 and every publishable package
# in the oma dependency closure ships to npm at that version (lockstep), and the
# gateway artifact is attached to the GitHub release.
#
# Rehearse it without shipping anything:
#   gh workflow run publish.yml -f dry_run=true -f version=0.2.0-dryrun
# That builds, stamps and packs exactly like a release, then stops before the
# npm publish and the release creation.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, stamp and pack only: no npm publish, no GitHub release"
        type: boolean
        default: true
      version:
        description: "Version to stamp and pack (dry runs only; a tag overrides it)"
        type: string
        required: false

permissions:
  contents: write # tag + GitHub Release notes generation
  id-token: write # npm provenance via GitHub OIDC — no long-lived NPM_TOKEN
  attestations: write # build provenance for the gateway artifact

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for npm provenance attestations

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep zstd

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve the release version
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$GITHUB_REF_NAME" ] || [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            VERSION="${{ inputs.version }}"
          fi
          [ -n "$VERSION" ] || { echo "no version: pass -f version=… for a dry run"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "releasing $VERSION (dry_run=${{ inputs.dry_run }})"

      - name: Stamp tag version into publishable packages
        run: |
          TAG="${{ steps.version.outputs.version }}"
          node -e '
            const fs = require("fs");
            const tag = process.argv[1];
            const pkgs = [
              "packages/message",
              "packages/config",
              "packages/ai",
              "packages/tui",
              "packages/source-fetch",
              "packages/sandbox",
              "packages/agent-contract",
              "packages/adapter-mcp",
              "apps/oh-my-agent",
            ];
            for (const dir of pkgs) {
              const p = `${dir}/package.json`;
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = tag;
              for (const section of ["dependencies", "peerDependencies", "devDependencies"]) {
                for (const [name, range] of Object.entries(j[section] ?? {})) {
                  if (name.startsWith("@chengchenccc/") && range.startsWith("workspace:")) {
                    j[section][name] = `^${tag}`;
                  }
                }
              }
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            }
            console.log(`stamped ${tag} into ${pkgs.length} packages`);
          ' "$TAG"

      - name: Build
        run: bun run build

      - name: Audit tarball contents (fail closed on stray files)
        run: |
          for p in packages/message packages/config packages/ai packages/tui \
                   packages/source-fetch packages/sandbox packages/agent-contract \
                   packages/adapter-mcp apps/oh-my-agent; do
            echo "=== $p ==="
            (cd "$p" && npm pack --dry-run 2>&1 | grep -Ev "npm notice [0-9]+ package?" || true)
            (cd "$p" && npm pack --dry-run 2>&1 | grep -E "\.env|\.backend-data|node_modules|\.turbo|\.next" && \
              { echo "STRAY FILE IN TARBALL"; exit 1; } || true)
          done

      - name: Publish (topological order, provenance on)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          # npm reads auth from .npmrc, not from the env var directly
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "${HOME}/.npmrc"
          # prerelease versions (rc/beta/alpha) go to a matching dist-tag so
          # `npm i oma` never resolves to a prerelease
          DIST_TAG=latest
          case "${{ steps.version.outputs.version }}" in
            *-rc.*) DIST_TAG=rc ;;
            *-beta.*) DIST_TAG=beta ;;
            *-alpha.*) DIST_TAG=alpha ;;
          esac
          for p in packages/message packages/config packages/ai packages/tui \
                   packages/source-fetch packages/sandbox packages/agent-contract \
                   packages/adapter-mcp apps/oh-my-agent; do
            echo ">>> publishing $p"
            (cd "$p" && npm publish --access public --tag "$DIST_TAG")
          done
      - name: Pack the gateway artifact
        run: bash scripts/pack-gateway.sh --version "${{ steps.version.outputs.version }}" --out dist-gateway

      - name: Attest the artifact provenance
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-gateway/oma-gateway-*.tar.zst

      - name: Create GitHub release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-gateway/oma-gateway-*.tar.zst
            dist-gateway/SHA256SUMS
