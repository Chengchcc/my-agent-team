name: Artifact probe

# Acceptance test for the shippable stack: build → pack (scripts/pack-stack.sh)
# → boot both halves from the unpacked tarball → assert the product answers.
# It also answers the two questions the artifact plan rests on: the payload size
# /platform-independence and whether the standalone server runs on Bun.
# A small dev box cannot build this (`next build` hangs there), which is exactly
# why the artifact is produced and verified on a runner.
#
# Run manually: gh workflow run artifact-probe.yml
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep zstd

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Pack the stack artifact
        run: bash scripts/pack-stack.sh --version "probe-${GITHUB_SHA::7}" --out /tmp/dist

      - name: Unpack and check the manifest contract
        run: |
          set -euo pipefail
          mkdir -p /tmp/stack
          tar --zstd -xf /tmp/dist/oma-stack-*.tar.zst -C /tmp/stack
          echo "=== payload top level ==="
          du -sh /tmp/stack/* | sort -h
          # stack.json is the contract a launcher consumes: every path it names
          # must exist in the tarball, or the artifact ships broken.
          bun -e '
            const fs = require("fs"), path = require("path");
            const root = "/tmp/stack";
            const m = JSON.parse(fs.readFileSync(path.join(root, "stack.json"), "utf8"));
            for (const c of m.components) {
              const entry = path.join(root, c.cwd, c.entry);
              if (!fs.existsSync(entry)) throw new Error(`missing entry for ${c.name}: ${entry}`);
              for (const [k, v] of Object.entries(c.env)) {
                if (!String(v).startsWith("{root}")) continue;
                const p = String(v).replace("{root}", root);
                if (!fs.existsSync(p)) throw new Error(`env ${k} points at a missing path: ${p}`);
              }
            }
            console.log("manifest ok:", m.components.map((c) => `${c.name}:${c.port}`).join(", "));
          '
          echo "| payload (unpacked) | $(du -sh /tmp/stack | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Boot both halves from the artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/stack-data/backend
          export BACKEND_AUTH_TOKEN=probe-token
          # Backend half. OMA_BIN is what the real launcher fills with its own
          # executable; here the repo's built CLI stands in.
          ( cd /tmp/stack/backend && \
            BACKEND_DATA_DIR=/tmp/stack-data/backend \
            BACKEND_MIGRATIONS_DIR=/tmp/stack/backend/drizzle/backend \
            BACKEND_RESOURCES_DIR=/tmp/stack/resources \
            KNOWLEDGE_MCP_SERVER_BIN=/tmp/stack/backend/knowledge-mcp.js \
            OMA_BIN="$GITHUB_WORKSPACE/apps/oh-my-agent/dist/cli.js" \
            bun main.js > /tmp/backend.log 2>&1 & )
          # Web half: the standalone entry must be run from its app directory.
          ( cd /tmp/stack/web/apps/web && \
            BACKEND_URL=http://127.0.0.1:3000 \
            BACKEND_AUTH_TOKEN="$BACKEND_AUTH_TOKEN" \
            SESSION_SECRET=probe-session-secret \
            MOCK_USER_ID=user-001 MOCK_PASSWORD=probe-password \
            NODE_ENV=production PORT=3001 HOSTNAME=127.0.0.1 \
            bun server.js > /tmp/web.log 2>&1 & )

          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3000/health && \
            curl -sf -o /dev/null http://127.0.0.1:3001/login && break
            sleep 1
          done

          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/health)
          LOGIN_PAGE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/login)
          GATED=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/today)

          JAR=/tmp/cookies.txt; rm -f "$JAR"
          AUTH=$(curl -s -c "$JAR" -o /dev/null -w "%{http_code}" \
            -X POST -H "content-type: application/json" \
            -d '{"userId":"user-001","password":"probe-password"}' \
            http://127.0.0.1:3001/api/auth/login)
          SESSION=$(curl -s -b "$JAR" -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/api/auth/session)
          # The money path: a Server Component reading the backend with the
          # privileged token through the shipped artifact.
          SSR=$(curl -s -b "$JAR" -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/workflows)
          # BFF proxy: the backend's own "Not found" shape proves the request
          # reached it (there is no /api/health route).
          BFF=$(curl -s -b "$JAR" http://127.0.0.1:3001/api/bff/health || true)

          {
            echo "| check | result |"
            echo "|---|---|"
            echo "| backend /health | $HEALTH |"
            echo "| web /login (SSR) | $LOGIN_PAGE |"
            echo "| web /today (gated) | $GATED |"
            echo "| login POST | $AUTH |"
            echo "| /api/auth/session | $SESSION |"
            echo "| /workflows (SSR + privileged backend read) | $SSR |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "backend /health   -> $HEALTH (expect 200)"
          echo "web /login        -> $LOGIN_PAGE (expect 200)"
          echo "web /today        -> $GATED (expect 307)"
          echo "login POST        -> $AUTH (expect 302)"
          echo "session           -> $SESSION (expect 200)"
          echo "/workflows        -> $SSR (expect 200)"
          echo "bff proxy body    -> $BFF"
          echo
          echo "=== backend log ==="; head -20 /tmp/backend.log
          echo "=== web log ==="; head -20 /tmp/web.log

          # Runtime: bun only. `bun run next ...` would land on Node because of
          # the bin shebang; the standalone entry is invoked with bun directly.
          echo "runtime: bun $(bun --version)"

          [ "$HEALTH" = "200" ] || { echo "FAIL: backend did not come up"; exit 1; }
          [ "$LOGIN_PAGE" = "200" ] || { echo "FAIL: web did not render"; exit 1; }
          [ "$GATED" = "307" ] || { echo "FAIL: middleware did not gate"; exit 1; }
          [ "$AUTH" = "302" ] || { echo "FAIL: login failed"; exit 1; }
          [ "$SESSION" = "200" ] || { echo "FAIL: no session after login"; exit 1; }
          [ "$SSR" = "200" ] || { echo "FAIL: authenticated SSR page failed"; exit 1; }
          case "$BFF" in *"Not found"*) ;; *) echo "FAIL: BFF proxy did not reach the backend"; exit 1 ;; esac
          echo "ok: the artifact boots and serves the product end to end"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: oma-stack-probe
          path: |
            /tmp/dist/oma-stack-*.tar.zst
            /tmp/dist/SHA256SUMS
          retention-days: 5
